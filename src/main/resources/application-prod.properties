# ===================================================================
# Production Profile (Activated via SPRING_PROFILES_ACTIVE=prod)
# ===================================================================

# Require a production signing key instead of falling back to the development default.
jwt.secret=${JWT_SECRET}

# Strict Datasource configuration (Requires explicit environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Non-destructive Production Schema Policy:
# 'update' is safely maintained to avoid dropping any existing data while ensuring required tables exist.
# (Never use 'create' or 'create-drop' in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Production Connection Pool Configuration
# Sized sensibly for cloud PaaS and managed database tier limits (e.g. Aiven)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=LeaveManagementHikariCP
spring.datasource.hikari.validation-timeout=5000
