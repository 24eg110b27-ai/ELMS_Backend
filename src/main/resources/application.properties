# Common configuration across all environments
spring.application.name=leave-management

# Server Port
server.port=${PORT:${SERVER_PORT:8080}}

# Default profile if none explicitly activated
spring.profiles.default=local

# JPA Common Settings
spring.jpa.open-in-view=false

# JWT configuration
jwt.secret=${JWT_SECRET:default_jwt_secret_must_be_overridden_in_production_32_chars_min}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://elmsfrontend-nwlosr9jo-csk-8cda.vercel.app,http://localhost:5173,http://127.0.0.1:5173}