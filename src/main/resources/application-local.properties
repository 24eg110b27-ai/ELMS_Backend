# ===================================================================
# Local Development Profile
# ===================================================================

# Optional local .env file import for local developer overrides
spring.config.import=optional:file:.env[.properties]

# Datasource Configuration for Local Development
# Defaults to standard local MySQL if environment variables are not supplied
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/leave_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration for Local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# HikariCP Local Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
