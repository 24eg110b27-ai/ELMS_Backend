# ===================================================================
# Test Profile (Activated during tests or with SPRING_PROFILES_ACTIVE=test)
# ===================================================================

# Disables mandatory real database requirement in build tests
spring.datasource.url=jdbc:mysql://localhost:3306/testdb_unreachable_mock
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Do not run ddl against non-existent database in isolated test runs
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
